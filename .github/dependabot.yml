version: 2
updates:
  # Security updates only for npm.
  # open-pull-requests-limit: 0 disables routine version bumps, but Dependabot
  # still opens PRs for known vulnerabilities (grouped below).
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 0
    versioning-strategy: increase
    groups:
      security-patches:
        applies-to: security-updates
        patterns:
          - '*'

  # Same policy for Actions: security PRs only, no routine major spam.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 0
    groups:
      github-actions-security:
        applies-to: security-updates
        patterns:
          - '*'
